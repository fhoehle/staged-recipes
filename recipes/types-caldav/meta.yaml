{% set name = "types-caldav" %}
{% set version = "0.9.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/types-caldav-{{ version }}.tar.gz
  sha256: f39834c34f033ce2bda214a4ea04f5612f8f903e261b591924928cd5baadf50a

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - pip
    - python
  run:
    - python
    - types-requests
    - types-vobject

test:
  commands:
    - test -f $SP_DIR/caldav-stubs/__init__.pyi

about:
  home: https://github.com/python/typeshed
  summary: Typing stubs for caldav
  license: Apache-2.0 AND MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - conda-forge/mypy
    - fhoehle
